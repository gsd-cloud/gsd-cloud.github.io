<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Notas</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; background: #FFFFFF; max-width: 560px; margin: 0 auto; padding: 40px 16px 48px; text-align: center; }
  h1 { font-size: 1.9em; margin-bottom: 4px; color: #1565C0; }
  p { font-size: 1em; }
  .lema { color: #666; margin-top: 0; }
  .boton { display: block; margin: 14px auto; max-width: 300px; padding: 14px 18px; border-radius: 26px; background: #1565C0; color: #FFFFFF; text-decoration: none; font-weight: 700; }
  .proximamente { background: #F3F6FB; color: #666; border-radius: 26px; padding: 14px 18px; max-width: 300px; margin: 14px auto; }
  .oculto { display: none; }
  a { color: #1565C0; }
</style>
</head>
<body>

<h1>Mis Notas</h1>
<p class="lema">Notas con dictado por voz, listas, fotos y audios, organizadas en carpetas.</p>

<!-- ========== DESCARGA SEGÚN EL MÓVIL (como listasuper.html de Lista Super) ==========
     Lo comparte la app de iPhone en «Recomendar la app» (Android comparte Google Play directamente).
     Cuando la App Store dé el ID de la app, ponerlo en URL_APP_STORE (p. ej. "https://apps.apple.com/app/id1234567890").
     Mientras esté vacío, en iPhone sale «Próximamente en la App Store». -->
<a id="appStore" class="boton oculto" href="#">Descargar en la App Store</a>
<p id="proximamente" class="proximamente oculto">Próximamente en la App Store</p>
<a id="googlePlay" class="boton oculto" href="https://play.google.com/store/apps/details?id=com.gsd.voicenotepro">Descargar en Google Play</a>

<script>
  var URL_APP_STORE = "";
  var ua = navigator.userAgent || "";
  var esAndroid = /Android/i.test(ua);
  var esApple = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  function ver(id) { document.getElementById(id).classList.remove("oculto"); }
  if (URL_APP_STORE) document.getElementById("appStore").href = URL_APP_STORE;
  if (esAndroid) {
    ver("googlePlay");
    location.replace(document.getElementById("googlePlay").href);
  } else if (esApple) {
    if (URL_APP_STORE) { ver("appStore"); location.replace(URL_APP_STORE); } else { ver("proximamente"); }
  } else {
    if (URL_APP_STORE) ver("appStore"); else ver("proximamente");
    ver("googlePlay");
  }
</script>
<!-- ========== FIN DESCARGA SEGÚN EL MÓVIL ========== -->

<p><a href="soporte-misnotas.html">Soporte</a> · <a href="privacy.html">Política de privacidad</a></p>

</body>
</html>
